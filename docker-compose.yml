# Image versions are pinned. Change them on purpose, after reading the release notes.
services:
  caddy:
    image: caddy:2.11.7
    restart: unless-stopped
    environment:
      N8N_HOST: ${N8N_HOST:?set N8N_HOST in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - n8n

  n8n:
    image: docker.n8n.io/n8nio/n8n:2.43.8
    restart: unless-stopped
    environment:
      N8N_HOST: ${N8N_HOST:?set N8N_HOST in .env}
      N8N_PROTOCOL: https
      N8N_PORT: 5678
      WEBHOOK_URL: https://${N8N_HOST}/
      GENERIC_TIMEZONE: ${TIMEZONE:?set TIMEZONE in .env}
      TZ: ${TIMEZONE:?set TIMEZONE in .env}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in .env}
      N8N_SECURE_COOKIE: "true"
      N8N_RUNNERS_ENABLED: "true"
      N8N_PROXY_HOPS: "1"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    volumes:
      - n8n_data:/home/node/.n8n

# Fixed name so scripts/backup.sh can address the volume directly.
volumes:
  n8n_data:
    name: n8n_data
  caddy_data:
  caddy_config:
